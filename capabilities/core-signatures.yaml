        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/teams/{team-id}/signatures
      name: teams-team-id-signatures
      description: REST surface for teams-team_id-signatures.
      operations:
      - method: GET
        name: listteamsignatures
        description: List team signatures
        call: core-signatures.listteamsignatures
        with:
          team_id: rest.team_id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
