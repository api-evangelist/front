      description: REST surface for teammates-teammate_id-signatures.
      operations:
      - method: GET
        name: listteammatesignatures
        description: List teammate signatures
        call: core-signatures.listteammatesignatures
        with:
          teammate_id: rest.teammate_id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createteammatesignature
        description: Create teammate signature
        call: core-signatures.createteammatesignature
        with:
          teammate_id: rest.teammate_id
