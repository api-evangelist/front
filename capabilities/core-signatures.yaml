    description: Core API — Signatures business capability. Self-contained, no shared references.
    resources:
    - name: signatures-signature_id
      path: /signatures/{signature_id}
      operations:
      - name: getsignatures
        method: GET
        description: Get signatures
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: signature_id
          in: path
          type: string
          description: The signature ID
          required: true
      - name: updatesignature
        method: PATCH
        description: Update signature
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: signature_id
          in: path
          type: string
          description: The signature ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: deletesignature
        method: DELETE
        description: Delete signature
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: signature_id
          in: path
          type: string
          description: The signature ID
          required: true
    - name: teammates-teammate_id-signatures
      path: /teammates/{teammate_id}/signatures
