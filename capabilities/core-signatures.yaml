    resources:
    - path: /v1/signatures/{signature-id}
      name: signatures-signature-id
      description: REST surface for signatures-signature_id.
      operations:
      - method: GET
        name: getsignatures
        description: Get signatures
        call: core-signatures.getsignatures
        with:
          signature_id: rest.signature_id
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatesignature
        description: Update signature
        call: core-signatures.updatesignature
        with:
          signature_id: rest.signature_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletesignature
        description: Delete signature
        call: core-signatures.deletesignature
        with:
          signature_id: rest.signature_id
        outputParameters:
        - type: object
          mapping: $.
