naftiko: 1.0.0-alpha2
info:
  label: Channel API — Calls
  description: 'Channel API — Calls. 5 operations. Lead operation: Create a call. Self-contained Naftiko capability covering
    one Front business surface.'
  tags:
  - Front
  - Calls
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
