    resources:
    - name: channels-channel_id-calls
      path: /channels/{channel_id}/calls
      operations:
      - name: createcall
        method: POST
        description: Create a call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: channel_id
          in: path
          type: string
          description: The Channel ID.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: channels-channel_id-calls-external_call_id
      path: /channels/{channel_id}/calls/{external_call_id}
      operations:
      - name: updatecall
        method: PATCH
        description: Update call status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: channel_id
          in: path
          type: string
          description: The Channel ID.
          required: true
        - name: external_call_id
          in: path
          type: string
          description: The external call ID from the provider system (same as `external_call_id` on create).
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
