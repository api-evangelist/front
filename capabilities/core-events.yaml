naftiko: 1.0.0-alpha2
info:
  label: Core API — Events
  description: 'Core API — Events. 2 operations. Lead operation: List events. Self-contained Naftiko capability covering one
    Front business surface.'
  tags:
  - Front
  - Events
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FRONT_API_KEY: FRONT_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-events
    baseUri: https://api2.frontapp.com
    description: Core API — Events business capability. Self-contained, no shared references.
    resources:
    - name: events
      path: /events
      operations:
      - name: listevents
        method: GET
        description: List events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Max number of results per page (max 15)
    - name: events-event_id
      path: /events/{event_id}
      operations:
      - name: getevent
        method: GET
        description: Get event
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: event_id
          in: path
          type: string
          description: The event ID
          required: true
    authentication:
      type: bearer
      token: '{{env.FRONT_API_KEY}}'
  exposes:
  - type: rest
    namespace: core-events-rest
    port: 8080
    description: REST adapter for Core API — Events. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/events
      name: events
      description: REST surface for events.
      operations:
      - method: GET
        name: listevents
        description: List events
        call: core-events.listevents
        with:
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events/{event-id}
      name: events-event-id
      description: REST surface for events-event_id.
      operations:
      - method: GET
        name: getevent
        description: Get event
        call: core-events.getevent
        with:
          event_id: rest.event_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-events-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — Events. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-events
      description: List events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-events.listevents
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: get-event
      description: Get event
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-events.getevent
      with:
        event_id: tools.event_id
      outputParameters:
      - type: object
        mapping: $.
