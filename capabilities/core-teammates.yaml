    resources:
    - name: teammates
      path: /teammates
      operations:
      - name: listteammates
        method: GET
        description: List teammates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: teammates-teammate_id
      path: /teammates/{teammate_id}
      operations:
      - name: getteammate
        method: GET
        description: Get teammate
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: teammate_id
          in: path
          type: string
          description: The teammate ID. Alternatively, you can supply an email as a [resource alias](https://dev.frontapp.com/docs/resource-aliases-1).
          required: true
      - name: updateteammate
        method: PATCH
        description: Update teammate
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: teammate_id
          in: path
          type: string
          description: The teammate ID. Alternatively, you can supply an email as a [resource alias](https://dev.frontapp.com/docs/resource-aliases-1).
