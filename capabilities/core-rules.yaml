naftiko: 1.0.0-alpha2
info:
  label: Core API — Rules
  description: 'Core API — Rules. 5 operations. Lead operation: List all company rules. Self-contained Naftiko capability
    covering one Front business surface.'
  tags:
  - Front
  - Rules
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FRONT_API_KEY: FRONT_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-rules
    baseUri: https://api2.frontapp.com
    description: Core API — Rules business capability. Self-contained, no shared references.
    resources:
    - name: company-rules
      path: /company/rules
      operations:
      - name: listallcompanyrules
        method: GET
        description: List all company rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: rules
      path: /rules
      operations:
      - name: listrules
        method: GET
        description: List rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: rules-rule_id
      path: /rules/{rule_id}
      operations:
      - name: getrule
        method: GET
        description: Get rule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: rule_id
          in: path
          type: string
          description: The Rule ID
          required: true
    - name: teammates-teammate_id-rules
      path: /teammates/{teammate_id}/rules
      operations:
      - name: listteammaterules
        method: GET
        description: List teammate rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: teammate_id
          in: path
          type: string
          description: The teammate ID. Alternatively, you can supply an email as a [resource alias](https://dev.frontapp.com/docs/resource-aliases-1).
          required: true
    - name: teams-team_id-rules
      path: /teams/{team_id}/rules
      operations:
      - name: listteamrules
        method: GET
        description: List team rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: team_id
          in: path
          type: string
          description: The team ID
          required: true
    authentication:
      type: bearer
      token: '{{env.FRONT_API_KEY}}'
  exposes:
  - type: rest
    namespace: core-rules-rest
    port: 8080
    description: REST adapter for Core API — Rules. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/company/rules
      name: company-rules
      description: REST surface for company-rules.
      operations:
      - method: GET
        name: listallcompanyrules
        description: List all company rules
        call: core-rules.listallcompanyrules
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/rules
      name: rules
      description: REST surface for rules.
      operations:
      - method: GET
        name: listrules
        description: List rules
        call: core-rules.listrules
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/rules/{rule-id}
      name: rules-rule-id
      description: REST surface for rules-rule_id.
      operations:
      - method: GET
        name: getrule
        description: Get rule
        call: core-rules.getrule
        with:
          rule_id: rest.rule_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/teammates/{teammate-id}/rules
      name: teammates-teammate-id-rules
      description: REST surface for teammates-teammate_id-rules.
      operations:
      - method: GET
        name: listteammaterules
        description: List teammate rules
        call: core-rules.listteammaterules
        with:
          teammate_id: rest.teammate_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/teams/{team-id}/rules
      name: teams-team-id-rules
      description: REST surface for teams-team_id-rules.
      operations:
      - method: GET
        name: listteamrules
        description: List team rules
        call: core-rules.listteamrules
        with:
          team_id: rest.team_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-rules-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — Rules. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-all-company-rules
      description: List all company rules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-rules.listallcompanyrules
      outputParameters:
      - type: object
        mapping: $.
    - name: list-rules
      description: List rules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-rules.listrules
      outputParameters:
      - type: object
        mapping: $.
    - name: get-rule
      description: Get rule
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-rules.getrule
      with:
        rule_id: tools.rule_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-teammate-rules
      description: List teammate rules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-rules.listteammaterules
      with:
        teammate_id: tools.teammate_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-team-rules
      description: List team rules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-rules.listteamrules
      with:
        team_id: tools.team_id
      outputParameters:
      - type: object
        mapping: $.
