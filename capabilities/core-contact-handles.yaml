naftiko: 1.0.0-alpha2
info:
  label: Core API — Contact Handles
  description: 'Core API — Contact Handles. 2 operations. Lead operation: Add contact handle. Self-contained Naftiko capability
    covering one Front business surface.'
  tags:
  - Front
  - Contact Handles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FRONT_API_KEY: FRONT_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-contact-handles
    baseUri: https://api2.frontapp.com
    description: Core API — Contact Handles business capability. Self-contained, no shared references.
    resources:
    - name: contacts-contact_id-handles
      path: /contacts/{contact_id}/handles
      operations:
      - name: addcontacthandle
        method: POST
        description: Add contact handle
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: contact_id
          in: path
          type: string
          description: The contact ID. Alternatively, you can supply the contact's source and handle as a [resource alias](https://dev.frontapp.com/docs/resource-aliases-1).
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: deletecontacthandle
        method: DELETE
        description: Delete contact handle
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: contact_id
          in: path
          type: string
          description: The contact ID. Alternatively, you can supply the contact's source and handle as a [resource alias](https://dev.frontapp.com/docs/resource-aliases-1).
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.FRONT_API_KEY}}'
  exposes:
  - type: rest
    namespace: core-contact-handles-rest
    port: 8080
    description: REST adapter for Core API — Contact Handles. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/contacts/{contact-id}/handles
      name: contacts-contact-id-handles
      description: REST surface for contacts-contact_id-handles.
      operations:
      - method: POST
        name: addcontacthandle
        description: Add contact handle
        call: core-contact-handles.addcontacthandle
        with:
          contact_id: rest.contact_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletecontacthandle
        description: Delete contact handle
        call: core-contact-handles.deletecontacthandle
        with:
          contact_id: rest.contact_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-contact-handles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — Contact Handles. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: add-contact-handle
      description: Add contact handle
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-contact-handles.addcontacthandle
      with:
        contact_id: tools.contact_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-contact-handle
      description: Delete contact handle
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: core-contact-handles.deletecontacthandle
      with:
        contact_id: tools.contact_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
