# Vendor facets — Front. Shared-inbox customer-operations platform with a knowledge base / help
# center that can be public or login-controlled and, on Professional and up, run on the provider's
# own domain. Headline: one 2-point pointer check (support_channel, ~45% catalog pass rate, not
# saturated); getting-started and auth only where the provider writes those articles. No community
# product and no llms.txt observed.
vendor: front
name: Front
website: https://front.com
areas:
- support
registry_keys: []
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Front earns a provider one check: a declared, public help center is a support channel, 2 points in developer
  ergonomics. Its knowledge-base articles can hold a getting-started guide and an authentication page
  only when the provider writes and declares them. A login-controlled help center is still a support channel
  but cannot serve as public documentation. No llms.txt on Front's own help center, no community forum,
  and no registry fingerprint, so the profile is capability-only.
features:
- id: help-center
  name: Help center and knowledge base
  description: >-
    Hosted knowledge base with a customer portal, chat widget and contact form; public or private site
    visibility; multiple help centers on Professional and up.
  source: https://help.front.com/en/articles/3093440
  tier: all
- id: help-center-custom-domain
  name: Help center custom domain
  description: >-
    Up to two custom (non-apex) domains per help center by CNAME, one primary and one redirect; latest
    Professional plan and above.
  source: https://help.front.com/en/articles/252608
  tier: paid
maps:
- feature: help-center
  check: support_channel
  layer: composite
  credit: 1.0
  provider_must: Declare the help center in apis.yml common[] as HelpCenter or Support.
  catalog_pass_rate: 0.45
  facet: developer_ergonomics
  points: 2
  baseline_pass_rate: 0.69
- feature: help-center
  check: getting_started_present
  layer: composite
  conditional: true
  condition: >-
    Only if the provider writes a getting-started guide for its API as a public help-center article and
    declares it as GettingStarted.
  provider_must: Write the guide, keep it public, and declare its URL as GettingStarted.
  catalog_pass_rate: 0.206
  facet: developer_ergonomics
  points: 5
  baseline_pass_rate: 0.636
- feature: help-center
  check: authentication_documented
  layer: composite
  conditional: true
  condition: >-
    Only if the provider documents its API authentication in a public help-center article and declares
    it as Authentication.
  provider_must: Write the page, keep it public, and declare its URL as Authentication.
  catalog_pass_rate: 0.368
  facet: developer_ergonomics
  points: 5
  baseline_pass_rate: 0.94
  saturated: true
  saturated_note: >-
    94% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
earns_nothing:
- feature: help-center-custom-domain
  why: No check reads the host of a support pointer.
